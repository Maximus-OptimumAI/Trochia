name: CI

on:
  pull_request:
  push:
    branches: [main]

# Expected GitHub repo secrets (added in repo settings, never committed):
#   DATABASE_URL          — runtime (pooled) Postgres connection
#   DIRECT_URL            — direct Postgres connection (drizzle-kit migrations)
#   TEST_DATABASE_URL     — a throwaway/test Postgres; the RLS integration tests
#                           (tests/rls/**) RUN when this is set and skip when it isn't.
#   SUPABASE_URL / SUPABASE_PUBLISHABLE_KEY / SUPABASE_SECRET_KEY
#   NEXT_PUBLIC_SUPABASE_URL / NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
#                           — required-in-prod by src/lib/env.ts (build runs NODE_ENV=production)
#   NEXT_PUBLIC_SITE_URL  — required by src/lib/env.ts at build time
#   NEXT_PUBLIC_APP_URL   — required by src/lib/env.ts at build time
#   PLAYWRIGHT_BASE_URL   — Vercel preview URL for e2e (else the local webServer is used)
#   ANTHROPIC_API_KEY     — required-in-prod by src/lib/env.ts (build runs NODE_ENV=production);
#                           a CI fallback is used until the real key secret is added.
# Later plans add: STRIPE_*, INNGEST_*, etc. as test secrets.

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: lint · typecheck · banned-strings · vitest · playwright · lighthouse
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL || 'http://localhost:3000' }}
      NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL || 'http://localhost:3000' }}
      DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://localhost:5432/ci' }}
      DIRECT_URL: ${{ secrets.DIRECT_URL || 'postgresql://localhost:5432/ci' }}
      # RLS integration tests (tests/rls/**) run only when this is set:
      TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
      # Required-in-prod by src/lib/env.ts; `npm run build` sets NODE_ENV=production.
      # Fallbacks keep the build green before the real Supabase secrets are added.
      SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'http://localhost:54321' }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || 'ci-publishable' }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY || 'ci-secret' }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'http://localhost:54321' }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || 'ci-publishable' }}
      # Required-in-prod by src/lib/env.ts (Plan 04 / 01-04 flipped ANTHROPIC_API_KEY).
      # The CI fallback keeps the production build green before the real key secret is added.
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || 'ci-anthropic-key' }}
      # Required-in-prod by src/lib/env.ts (Plan 05 / 01-05 flipped the observability + email vars).
      # Fallbacks keep the production build green before the real secrets are added.
      SENTRY_DSN: ${{ secrets.SENTRY_DSN || 'https://ci@ci.ingest.sentry.io/0' }}
      NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN || 'https://ci@ci.ingest.sentry.io/0' }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG || 'ci-org' }}
      SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT || 'ci-project' }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN || 'ci-sentry-auth-token' }}
      AMPLITUDE_API_KEY: ${{ secrets.AMPLITUDE_API_KEY || 'ci-amplitude-key' }}
      NEXT_PUBLIC_AMPLITUDE_API_KEY: ${{ secrets.NEXT_PUBLIC_AMPLITUDE_API_KEY || 'ci-amplitude-key' }}
      LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY || 'pk-lf-ci' }}
      LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY || 'sk-lf-ci' }}
      LANGFUSE_HOST: ${{ secrets.LANGFUSE_HOST || 'https://cloud.langfuse.com' }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY || 're_ci_key' }}
      PLAYWRIGHT_BASE_URL: ${{ secrets.PLAYWRIGHT_BASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Banned-string check
        run: npm run check:banned

      - name: Unit + integration tests (Vitest)
        # RLS integration tests skip themselves when DATABASE_URL is absent —
        # later plans add the test-db secret.
        run: npm run test

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E tests (Playwright)
        run: npm run test:e2e

      - name: Lighthouse CI
        # Soft-fail for now (the marketing `/` route ships in Plan 08; flip to a
        # hard gate then). Asserts perf/a11y/best-practices/SEO >= 0.9 on `/`.
        continue-on-error: true
        run: npx lhci autorun
