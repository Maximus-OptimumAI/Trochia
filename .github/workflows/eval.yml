name: Eval Harness

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  # `pull-requests: write` removed at T08 close — the workflow uploads an
  # artifact + writes to GITHUB_STEP_SUMMARY but does NOT post PR comments.
  # The PR-comment step described in plan must_haves artifact #11 is deferred
  # to FOLLOWUP-EVAL-PR-COMMENT-01 (lands when eval checks go real in Plan
  # 02-05). Re-add `pull-requests: write` at that time. (/cso F2, 2026-05-30.)

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run eval suite
        id: eval
        env:
          # All eval checks return 'pending' at Plan 02-04 close.
          # Plan 02-05 wires in Test-CI DATABASE_URL + ANTHROPIC_API_KEY + VOYAGE_API_KEY
          # secrets to unlock the real check implementations.
          NODE_ENV: test
        run: npm run eval:run
      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: eval-report.json
          retention-days: 30
